<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />

  <title>دليل العيادات والخدمات</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --secondary: #14b8a6;
      --background: #f4f8f8;
      --card: #ffffff;
      --text: #16302f;
      --muted: #6b7c7b;
      --border: #e2e8e7;
      --danger: #dc2626;
      --shadow: 0 10px 30px rgba(15, 118, 110, 0.08);
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    button {
      cursor: pointer;
      border: none;
    }

    /* ================= HEADER ================= */

    header {
      background: linear-gradient(
        135deg,
        var(--primary),
        var(--primary-dark)
      );
      color: white;
      padding: 30px 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .header-content {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 55px;
      height: 55px;
      background: rgba(255,255,255,0.15);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .logo h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .logo p {
      opacity: 0.85;
      font-size: 13px;
    }

    .admin-btn {
      background: white;
      color: var(--primary);
      padding: 11px 18px;
      border-radius: 10px;
      font-weight: bold;
    }

    /* ================= CONTAINER ================= */

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px 60px;
    }

    .page-title {
      text-align: center;
      margin-bottom: 30px;
    }

    .page-title h2 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .page-title p {
      color: var(--muted);
    }

    /* ================= CLINICS ================= */

    .clinics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .clinic-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 25px;
      box-shadow: var(--shadow);
      transition: 0.25s;
      cursor: pointer;
      text-align: center;
    }

    .clinic-card:hover {
      transform: translateY(-5px);
      border-color: var(--secondary);
    }

    .clinic-icon {
      width: 75px;
      height: 75px;
      margin: 0 auto 15px;
      background: #e6fffb;
      color: var(--primary);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }

    .clinic-card h3 {
      font-size: 19px;
      margin-bottom: 8px;
    }

    .clinic-card span {
      color: var(--muted);
      font-size: 13px;
    }

    /* ================= SERVICES PAGE ================= */

    .back-btn {
      background: white;
      color: var(--primary);
      border: 1px solid var(--border);
      padding: 10px 18px;
      border-radius: 10px;
      margin-bottom: 25px;
      font-weight: bold;
    }

    .clinic-header {
      background: white;
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 25px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: var(--shadow);
    }

    .clinic-header-icon {
      width: 70px;
      height: 70px;
      background: #e6fffb;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    .clinic-header h2 {
      margin-bottom: 6px;
    }

    .clinic-header p {
      color: var(--muted);
      font-size: 14px;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 18px;
    }

    .service-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px 15px;
      text-align: center;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: var(--shadow);
    }

    .service-card:hover {
      transform: translateY(-4px);
      border-color: var(--secondary);
    }

    .service-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .service-card h3 {
      font-size: 16px;
    }

    /* ================= MODAL ================= */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 550px;
      background: white;
      border-radius: 25px;
      overflow: hidden;
      animation: modalIn 0.25s ease;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-top {
      background: linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
      );
      color: white;
      padding: 28px;
      text-align: center;
    }

    .modal-icon {
      font-size: 55px;
      margin-bottom: 10px;
    }

    .modal-top h2 {
      font-size: 24px;
    }

    .modal-body {
      padding: 25px;
    }

    .modal-body p {
      color: #475b59;
      line-height: 1.9;
      white-space: pre-line;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 13px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 15px;
    }

    .close-btn {
      background: #eef2f2;
      color: #374443;
    }

    .share-btn {
      background: var(--primary);
      color: white;
    }

    /* ================= ADMIN ================= */

    .admin-panel {
      display: none;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .admin-panel.active {
      display: block;
    }

    .admin-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
      gap: 15px;
    }

    .admin-title h2 {
      font-size: 24px;
    }

    .admin-section {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .admin-section h3 {
      margin-bottom: 15px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: var(--secondary);
    }

    .primary-btn {
      background: var(--primary);
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
    }

    .secondary-btn {
      background: #eef2f2;
      color: #334;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
    }

    .danger-btn {
      background: #fee2e2;
      color: var(--danger);
      padding: 9px 13px;
      border-radius: 8px;
      font-weight: bold;
    }

    .admin-clinic {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-top: 15px;
    }

    .admin-clinic-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 15px;
    }

    .admin-service {
      background: #f8faf9;
      border-radius: 10px;
      padding: 12px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .admin-service-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }

    /* ================= FOOTER ================= */

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 25px;
    }

    /* ================= MOBILE ================= */

    @media (max-width: 650px) {
      .header-content {
        flex-direction: column;
        text-align: center;
      }

      .logo {
        flex-direction: column;
      }

      .container {
        padding: 25px 15px 50px;
      }

      .page-title h2 {
        font-size: 23px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .admin-title {
        flex-direction: column;
        align-items: stretch;
      }

      .clinic-header {
        flex-direction: column;
        text-align: center;
      }

      .modal-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- ================= HEADER ================= -->

  <header>
    <div class="header-content">

      <div class="logo">
        <div class="logo-icon">🏥</div>

        <div>
          <h1>دليل العيادات</h1>
          <p>العيادات والخدمات المتوفرة</p>
        </div>
      </div>

      <button class="admin-btn" onclick="openAdmin()">
        ⚙️ إدارة الموقع
      </button>

    </div>
  </header>


  <!-- ================= MAIN ================= -->

  <main class="container">

    <!-- HOME -->

    <section id="homePage">

      <div class="page-title">
        <h2>اختر العيادة</h2>
        <p>اضغط على اسم العيادة لمعرفة الخدمات المتوفرة</p>
      </div>

      <div id="clinicsGrid" class="clinics-grid"></div>

    </section>


    <!-- SERVICES -->

    <section id="servicesPage" style="display:none;">

      <button class="back-btn" onclick="showHome()">
        ← العودة للعيادات
      </button>

      <div id="clinicHeader"></div>

      <div id="servicesGrid" class="services-grid"></div>

    </section>


    <!-- ADMIN -->

    <section id="adminPage" class="admin-panel">

      <div class="admin-title">
        <h2>⚙️ إدارة الموقع</h2>

        <button class="secondary-btn" onclick="showHome()">
          العودة للموقع
        </button>
      </div>


      <!-- ADD CLINIC -->

      <div class="admin-section">

        <h3>➕ إضافة عيادة جديدة</h3>

        <div class="form-grid">

          <div class="form-group">
            <label>اسم العيادة</label>
            <input
              type="text"
              id="clinicName"
              placeholder="مثال: عيادة النور"
            />
          </div>

          <div class="form-group">
            <label>أيقونة العيادة</label>
            <input
              type="text"
              id="clinicIcon"
              placeholder="🏥"
              value="🏥"
            />
          </div>

          <div class="form-group full">
            <label>وصف العيادة</label>
            <textarea
              id="clinicDescription"
              placeholder="اكتب وصفًا مختصرًا للعيادة..."
            ></textarea>
          </div>

        </div>

        <button class="primary-btn" onclick="addClinic()">
          إضافة العيادة
        </button>

      </div>


      <!-- CLINICS MANAGEMENT -->

      <div class="admin-section">

        <h3>📋 العيادات والخدمات</h3>

        <div id="adminClinics"></div>

      </div>

    </section>

  </main>


  <!-- ================= MODAL ================= -->

  <div
    id="serviceModal"
    class="modal-overlay"
    onclick="closeModalOutside(event)"
  >

    <div class="modal">

      <div class="modal-top">

        <div id="modalIcon" class="modal-icon">🦷</div>

        <h2 id="modalTitle">اسم الخدمة</h2>

      </div>

      <div class="modal-body">

        <p id="modalDescription">
          تفاصيل الخدمة
        </p>

        <div class="modal-buttons">

          <button
            class="share-btn"
            onclick="shareService()"
          >
            📤 مشاركة كصورة
          </button>

          <button
            class="close-btn"
            onclick="closeModal()"
          >
            إغلاق
          </button>

        </div>

      </div>

    </div>

  </div>


  <footer>
    جميع الحقوق محفوظة © 2026
  </footer>


  <!-- ================= JAVASCRIPT ================= -->

  <script>

    /*
      =====================================================
      البيانات الافتراضية

      يمكنك تعديلها هنا إذا أردت.
      لكن بعد استخدام لوحة التحكم لن تحتاج لتعديل الكود.
      =====================================================
    */

    const defaultClinics = [

      {
        id: 1,
        name: "عيادة النور",
        icon: "🏥",
        description: "عيادة متخصصة تقدم مجموعة متنوعة من الخدمات الطبية.",
        services: [

          {
            id: 101,
            name: "تنظيف الأسنان",
            icon: "🦷",
            description:
              "خدمة تنظيف الأسنان وإزالة الجير والتصبغات للحصول على أسنان أكثر نظافة وصحة."
          },

          {
            id: 102,
            name: "تبييض الأسنان",
            icon: "✨",
            description:
              "جلسة تبييض احترافية تساعد على تفتيح لون الأسنان والحصول على ابتسامة أكثر إشراقًا."
          },

          {
            id: 103,
            name: "فحص شامل",
            icon: "🩺",
            description:
              "فحص شامل للحالة الصحية مع تقييم الحالة وتقديم التوصيات المناسبة."
          }

        ]
      },

      {
        id: 2,
        name: "عيادة الشفاء",
        icon: "🏨",
        description: "خدمات طبية متنوعة بأحدث الإمكانيات.",
        services: [

          {
            id: 201,
            name: "كشف طبي",
            icon: "👨‍⚕️",
            description:
              "كشف طبي شامل وتقييم الحالة الصحية وتحديد الخطوات المناسبة للعلاج."
          },

          {
            id: 202,
            name: "استشارة",
            icon: "💬",
            description:
              "جلسة استشارة مع الطبيب لمناقشة الحالة والإجابة على جميع الاستفسارات."
          }

        ]
      }

    ];


    /* =====================================================
       تحميل البيانات
       ===================================================== */

    let clinics =
      JSON.parse(localStorage.getItem("clinicsData")) ||
      defaultClinics;


    function saveData() {

      localStorage.setItem(
        "clinicsData",
        JSON.stringify(clinics)
      );

    }


    /* =====================================================
       عرض العيادات
       ===================================================== */

    function renderClinics() {

      const grid =
        document.getElementById("clinicsGrid");

      grid.innerHTML = "";

      if (clinics.length === 0) {

        grid.innerHTML = `
          <div class="empty">
            لا توجد عيادات حاليًا.
          </div>
        `;

        return;
      }


      clinics.forEach(clinic => {

        const card =
          document.createElement("div");

        card.className = "clinic-card";

        card.onclick = () =>
          openClinic(clinic.id);

        card.innerHTML = `

          <div class="clinic-icon">
            ${clinic.icon}
          </div>

          <h3>${escapeHTML(clinic.name)}</h3>

          <span>
            ${clinic.services.length} خدمة متوفرة
          </span>

        `;

        grid.appendChild(card);

      });

    }


    /* =====================================================
       فتح العيادة
       ===================================================== */

    function openClinic(clinicId) {

      const clinic =
        clinics.find(c => c.id === clinicId);

      if (!clinic) return;


      document.getElementById("homePage")
        .style.display = "none";

      document.getElementById("adminPage")
        .classList.remove("active");

      document.getElementById("servicesPage")
        .style.display = "block";


      document.getElementById("clinicHeader")
        .innerHTML = `

          <div class="clinic-header">

            <div class="clinic-header-icon">
              ${clinic.icon}
            </div>

            <div>
              <h2>${escapeHTML(clinic.name)}</h2>

              <p>
                ${escapeHTML(clinic.description || "")}
              </p>
            </div>

          </div>

        `;


      const grid =
        document.getElementById("servicesGrid");

      grid.innerHTML = "";


      if (clinic.services.length === 0) {

        grid.innerHTML = `
          <div class="empty">
            لا توجد خدمات مضافة لهذه العيادة.
          </div>
        `;

        return;
      }


      clinic.services.forEach(service => {

        const card =
          document.createElement("div");

        card.className = "service-card";

        card.onclick = () =>
          openService(clinic.id, service.id);

        card.innerHTML = `

          <div class="service-icon">
            ${service.icon}
          </div>

          <h3>
            ${escapeHTML(service.name)}
          </h3>

        `;

        grid.appendChild(card);

      });

    }


    /* =====================================================
       فتح تفاصيل الخدمة
       ===================================================== */

    let currentService = null;
    let currentClinic = null;


    function openService(clinicId, serviceId) {

      const clinic =
        clinics.find(c => c.id === clinicId);

      if (!clinic) return;


      const service =
        clinic.services.find(
          s => s.id === serviceId
        );

      if (!service) return;


      currentClinic = clinic;
      currentService = service;


      document.getElementById("modalIcon")
        .textContent = service.icon;

      document.getElementById("modalTitle")
        .textContent = service.name;

      document.getElementById("modalDescription")
        .textContent = service.description;


      document.getElementById("serviceModal")
        .classList.add("active");

    }


    function closeModal() {

      document.getElementById("serviceModal")
        .classList.remove("active");

    }


    function closeModalOutside(event) {

      if (
        event.target ===
        document.getElementById("serviceModal")
      ) {

        closeModal();

      }

    }


    /* =====================================================
       مشاركة الخدمة كصورة
       ===================================================== */

    async function shareService() {

      if (!currentService) return;


      const service =
        currentService;


      /*
        إنشاء Canvas
        وتحويل تفاصيل الخدمة إلى صورة
      */

      const canvas =
        document.createElement("canvas");

      const ctx =
        canvas.getContext("2d");


      canvas.width = 1080;
      canvas.height = 1350;


      /* Background */

      const gradient =
        ctx.createLinearGradient(
          0,
          0,
          1080,
          1350
        );

      gradient.addColorStop(
        0,
        "#0f766e"
      );

      gradient.addColorStop(
        1,
        "#14b8a6"
      );

      ctx.fillStyle = gradient;

      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      /* White Card */

      ctx.fillStyle = "#ffffff";

      roundRect(
        ctx,
        70,
        90,
        940,
        1170,
        35
      );

      ctx.fill();


      /* Icon */

      ctx.font = "110px Arial";

      ctx.textAlign = "center";

      ctx.fillText(
        service.icon,
        540,
        270
      );


      /* Title */

      ctx.fillStyle = "#16302f";

      ctx.font =
        "bold 52px Arial";

      ctx.fillText(
        service.name,
        540,
        390
      );


      /* Divider */

      ctx.fillStyle =
        "#14b8a6";

      ctx.fillRect(
        400,
        430,
        280,
        5
      );


      /* Description */

      ctx.fillStyle =
        "#475b59";

      ctx.font =
        "32px Arial";

      wrapText(
        ctx,
        service.description,
        540,
        530,
        780,
        52
      );


      /* Clinic */

      ctx.fillStyle =
        "#0f766e";

      ctx.font =
        "bold 28px Arial";

      ctx.fillText(
        currentClinic.name,
        540,
        1130
      );


      /* Footer */

      ctx.fillStyle =
        "#94a3a1";

      ctx.font =
        "22px Arial";

      ctx.fillText(
        "دليل العيادات والخدمات",
        540,
        1190
      );


      canvas.toBlob(async blob => {

        const file =
          new File(
            [blob],
            "service.png",
            {
              type: "image/png"
            }
          );


        /*
          إذا كان الجهاز يدعم مشاركة الملفات
        */

        if (
          navigator.share &&
          navigator.canShare &&
          navigator.canShare({
            files: [file]
          })
        ) {

          try {

            await navigator.share({
              title: service.name,
              text: service.description,
              files: [file]
            });

          } catch (error) {

            console.log(
              "تم إلغاء المشاركة"
            );

          }

        } else {

          /*
            إذا لم يدعم الجهاز المشاركة،
            يتم تنزيل الصورة
          */

          const link =
            document.createElement("a");

          link.download =
            "service.png";

          link.href =
            canvas.toDataURL("image/png");

          link.click();

          alert(
            "تم إنشاء الصورة وتنزيلها على جهازك."
          );

        }

      }, "image/png");

    }


    /* =====================================================
       أدوات رسم الصورة
       ===================================================== */

    function roundRect(
      ctx,
      x,
      y,
      width,
      height,
      radius
    ) {

      ctx.beginPath();

      ctx.moveTo(
        x + radius,
        y
      );

      ctx.lineTo(
        x + width - radius,
        y
      );

      ctx.quadraticCurveTo(
        x + width,
        y,
        x + width,
        y + radius
      );

      ctx.lineTo(
        x + width,
        y + height - radius
      );

      ctx.quadraticCurveTo(
        x + width,
        y + height,
        x + width - radius,
        y + height
      );

      ctx.lineTo(
        x + radius,
        y + height
      );

      ctx.quadraticCurveTo(
        x,
        y + height,
        x,
        y + height - radius
      );

      ctx.lineTo(
        x,
        y + radius
      );

      ctx.quadraticCurveTo(
        x,
        y,
        x + radius,
        y
      );

      ctx.closePath();

    }


    function wrapText(
      ctx,
      text,
      x,
      y,
      maxWidth,
      lineHeight
    ) {

      const words =
        text.split(" ");

      let line = "";

      const lines = [];


      for (
        let i = 0;
        i < words.length;
        i++
      ) {

        const testLine =
          line +
          words[i] +
          " ";

        const metrics =
          ctx.measureText(testLine);

        if (
          metrics.width >
          maxWidth &&
          i > 0
        ) {

          lines.push(line);

          line =
            words[i] + " ";

        } else {

          line = testLine;

        }

      }

      lines.push(line);


      lines.forEach(
        (line, index) => {

          ctx.fillText(
            line,
            x,
            y +
            index *
            lineHeight
          );

        }
      );

    }


    /* =====================================================
       لوحة التحكم
       ===================================================== */

    function openAdmin() {

      document.getElementById("homePage")
        .style.display = "none";

      document.getElementById("servicesPage")
        .style.display = "none";

      document.getElementById("adminPage")
        .classList.add("active");

      renderAdmin();

    }


    /* =====================================================
       إضافة عيادة
       ===================================================== */

    function addClinic() {

      const name =
        document.getElementById("clinicName")
          .value.trim();

      const icon =
        document.getElementById("clinicIcon")
          .value.trim() || "🏥";

      const description =
        document.getElementById("clinicDescription")
          .value.trim();


      if (!name) {

        alert(
          "من فضلك اكتب اسم العيادة."
        );

        return;

      }


      clinics.push({

        id: Date.now(),

        name,

        icon,

        description,

        services: []

      });


      saveData();

      renderAdmin();

      renderClinics();


      document.getElementById("clinicName")
        .value = "";

      document.getElementById("clinicDescription")
        .value = "";

      document.getElementById("clinicIcon")
        .value = "🏥";


      alert(
        "تمت إضافة العيادة بنجاح."
      );

    }


    /* =====================================================
       لوحة إدارة العيادات
       ===================================================== */

    function renderAdmin() {

      const container =
        document.getElementById("adminClinics");

      container.innerHTML = "";


      if (clinics.length === 0) {

        container.innerHTML = `
          <div class="empty">
            لا توجد عيادات.
          </div>
        `;

        return;
      }


      clinics.forEach(clinic => {

        const clinicDiv =
          document.createElement("div");

        clinicDiv.className =
          "admin-clinic";


        clinicDiv.innerHTML = `

          <div class="admin-clinic-header">

            <div>
              <strong>
                ${clinic.icon}
                ${escapeHTML(clinic.name)}
              </strong>

              <div style="
                color:#6b7c7b;
                font-size:13px;
                margin-top:5px;
              ">
                ${clinic.services.length} خدمة
              </div>
            </div>

            <button
              class="danger-btn"
              onclick="deleteClinic(${clinic.id})"
            >
              حذف العيادة
            </button>

          </div>


          <div>

            <strong>
              الخدمات:
            </strong>

            <div id="services-${clinic.id}">
            </div>

          </div>


          <hr style="
            border:none;
            border-top:1px solid #e2e8e7;
            margin:18px 0;
          ">


          <h4 style="margin-bottom:12px;">
            ➕ إضافة خدمة
          </h4>


          <div class="form-grid">

            <div class="form-group">

              <label>
                اسم الخدمة
              </label>

              <input
                id="service-name-${clinic.id}"
                placeholder="مثال: تبييض الأسنان"
              />

            </div>


            <div class="form-group">

              <label>
                الأيقونة
              </label>

              <input
                id="service-icon-${clinic.id}"
                value="🦷"
                placeholder="🦷"
              />

            </div>


            <div class="form-group full">

              <label>
                تفاصيل الخدمة
              </label>

              <textarea
                id="service-description-${clinic.id}"
                placeholder="اكتب تفاصيل الخدمة..."
              ></textarea>

            </div>

          </div>


          <button
            class="primary-btn"
            onclick="addService(${clinic.id})"
          >
            إضافة الخدمة
          </button>

        `;


        container.appendChild(
          clinicDiv
        );


        const servicesContainer =
          document.getElementById(
            `services-${clinic.id}`
          );


        if (
          clinic.services.length === 0
        ) {

          servicesContainer.innerHTML = `
            <div style="
              color:#6b7c7b;
              font-size:13px;
              margin-top:10px;
            ">
              لا توجد خدمات.
            </div>
          `;

        } else {

          clinic.services.forEach(
            service => {

              const div =
                document.createElement("div");

              div.className =
                "admin-service";

              div.innerHTML = `

                <div class="admin-service-info">

                  <span style="
                    font-size:25px;
                  ">
                    ${service.icon}
                  </span>

                  <span>
                    ${escapeHTML(service.name)}
                  </span>

                </div>

                <button
                  class="danger-btn"
                  onclick="
                    deleteService(
                      ${clinic.id},
                      ${service.id}
                    )
                  "
                >
                  حذف
                </button>

              `;

              servicesContainer.appendChild(
                div
              );

            }
          );

        }

      });

    }


    /* =====================================================
       إضافة خدمة
       ===================================================== */

    function addService(clinicId) {

      const clinic =
        clinics.find(
          c => c.id === clinicId
        );

      if (!clinic) return;


      const name =
        document.getElementById(
          `service-name-${clinicId}`
        ).value.trim();


      const icon =
        document.getElementById(
          `service-icon-${clinicId}`
        ).value.trim() || "🩺";


      const description =
        document.getElementById(
          `service-description-${clinicId}`
        ).value.trim();


      if (!name) {

        alert(
          "من فضلك اكتب اسم الخدمة."
        );

        return;

      }


      clinic.services.push({

        id: Date.now(),

        name,

        icon,

        description

      });


      saveData();

      renderAdmin();

      renderClinics();


      alert(
        "تمت إضافة الخدمة بنجاح."
      );

    }


    /* =====================================================
       حذف عيادة
       ===================================================== */

    function deleteClinic(clinicId) {

      const clinic =
        clinics.find(
          c => c.id === clinicId
        );


      if (!clinic) return;


      const confirmDelete =
        confirm(
          `هل أنت متأكد من حذف "${clinic.name}"؟`
        );


      if (!confirmDelete) return;


      clinics =
        clinics.filter(
          c => c.id !== clinicId
        );


      saveData();

      renderAdmin();

      renderClinics();

    }


    /* =====================================================
       حذف خدمة
       ===================================================== */

    function deleteService(
      clinicId,
      serviceId
    ) {

      const clinic =
        clinics.find(
          c => c.id === clinicId
        );


      if (!clinic) return;


      const service =
        clinic.services.find(
          s => s.id === serviceId
        );


      if (!service) return;


      const confirmDelete =
        confirm(
          `هل تريد حذف خدمة "${service.name}"؟`
        );


      if (!confirmDelete) return;


      clinic.services =
        clinic.services.filter(
          s => s.id !== serviceId
        );


      saveData();

      renderAdmin();

      renderClinics();

    }


    /* =====================================================
       الرجوع للصفحة الرئيسية
       ===================================================== */

    function showHome() {

      document.getElementById("homePage")
        .style.display = "block";

      document.getElementById("servicesPage")
        .style.display = "none";

      document.getElementById("adminPage")
        .classList.remove("active");

      renderClinics();

    }


    /* =====================================================
       حماية النصوص
       ===================================================== */

    function escapeHTML(text) {

      return String(text || "")
        .replace(
          /[&<>"']/g,
          function(match) {

            const chars = {

              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;"

            };

            return chars[match];

          }
        );

    }


    /* =====================================================
       تشغيل الموقع
       ===================================================== */

    renderClinics();

  </script>
